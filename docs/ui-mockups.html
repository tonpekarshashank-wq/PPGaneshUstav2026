document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

bilingual rule<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:660px;padding:32px 34px 36px\">\n  <div style=\"font:700 11px/1 Figtree,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#a3562a\">Design foundations<\u002Fdiv>\n  <div style=\"font-family:Caprasimo,serif;font-size:38px;line-height:1.08;color:#201e1d;margin-top:12px\">Ganeshotsav 2026<\u002Fdiv>\n  <div style=\"font-family:'Baloo 2',sans-serif;font-weight:600;font-size:27px;line-height:1.2;color:#7c3f1d\">गणेशोत्सव २०२६<\u002Fdiv>\n  <div style=\"font:400 15.5px/1.55 Figtree,sans-serif;color:#5c534d;max-width:52ch;margin-top:10px\">Cream ground, terracotta accent, sage as a second voice. Rounded containers and pill controls throughout. The festival reads through warmth, scale and type — not through added motifs.<\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:30px\">\n    <div>\n      <div style=\"font:700 11px/1 Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8a7f75\">Typefaces<\u002Fdiv>\n      <div style=\"margin-top:14px;padding-bottom:14px;border-bottom:1px solid rgba(32,30,29,.12)\">\n        <div style=\"font-family:Caprasimo,serif;font-size:30px;line-height:1.1;color:#201e1d\">Aarti Seva<\u002Fdiv>\n        <div style=\"font:400 12.5px/1.5 Figtree,sans-serif;color:#5c534d;margin-top:6px\"><strong style=\"font-weight:700\">Caprasimo<\u002Fstrong> — page titles and hero only. One weight, generous size, never below 22px.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;padding-bottom:14px;border-bottom:1px solid rgba(32,30,29,.12)\">\n        <div style=\"font-family:'Baloo 2',sans-serif;font-weight:700;font-size:28px;line-height:1.15;color:#201e1d\">आरती सेवा<\u002Fdiv>\n        <div style=\"font:400 12.5px/1.5 Figtree,sans-serif;color:#5c534d;margin-top:6px\"><strong style=\"font-weight:700\">Baloo 2<\u002Fstrong> — Caprasimo has no Devanagari. Baloo 2 is its rounded companion for every Marathi title.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px\">\n        <div style=\"font:700 19px/1.3 Figtree,sans-serif;color:#201e1d\">Morning Aarti · 8:00 am<\u002Fdiv>\n        <div style=\"font-family:Mukta,sans-serif;font-weight:400;font-size:15px;line-height:1.55;color:#201e1d\">सकाळची आरती — प्रत्येक दिवस<\u002Fdiv>\n        <div style=\"font:400 12.5px/1.5 Figtree,sans-serif;color:#5c534d;margin-top:6px\"><strong style=\"font-weight:700\">Figtree<\u002Fstrong> for Latin body, labels and buttons; <strong style=\"font-weight:700\">Mukta<\u002Fstrong> for Marathi body. Body text never below 15px.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font:700 11px/1 Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8a7f75\">Palette<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px\">\n        <div style=\"background:#f5ead8;border:1px solid rgba(32,30,29,.14);border-radius:14px;padding:13px\"><div style=\"font:700 12.5px/1.2 Figtree,sans-serif;color:#201e1d\">Cream / bg<\u002Fdiv><div style=\"font:400 11px/1.4 ui-monospace,monospace;color:#5c534d\">#F5EAD8<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#ebddc5;border-radius:14px;padding:13px\"><div style=\"font:700 12.5px/1.2 Figtree,sans-serif;color:#201e1d\">Sand / surface<\u002Fdiv><div style=\"font:400 11px/1.4 ui-monospace,monospace;color:#5c534d\">#EBDDC5<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#c67139;border-radius:14px;padding:13px\"><div style=\"font:700 12.5px/1.2 Figtree,sans-serif;color:#2b1405\">Terracotta<\u002Fdiv><div style=\"font:400 11px/1.4 ui-monospace,monospace;color:rgba(43,20,5,.75)\">#C67139<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#7c3f1d;border-radius:14px;padding:13px\"><div style=\"font:700 12.5px/1.2 Figtree,sans-serif;color:#f5ead8\">Terracotta 700<\u002Fdiv><div style=\"font:400 11px/1.4 ui-monospace,monospace;color:rgba(245,234,216,.75)\">#7C3F1D<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#7a8a5e;border-radius:14px;padding:13px\"><div style=\"font:700 12.5px/1.2 Figtree,sans-serif;color:#f5ead8\">Sage<\u002Fdiv><div style=\"font:400 11px/1.4 ui-monospace,monospace;color:rgba(245,234,216,.8)\">#7A8A5E<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#201e1d;border-radius:14px;padding:13px\"><div style=\"font:700 12.5px/1.2 Figtree,sans-serif;color:#f5ead8\">Ink<\u002Fdiv><div style=\"font:400 11px/1.4 ui-monospace,monospace;color:rgba(245,234,216,.7)\">#201E1D<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:400 12.5px/1.5 Figtree,sans-serif;color:#5c534d;margin-top:12px\">The current <span style=\"font:400 12px/1 ui-monospace,monospace;color:#7c3f1d\">#9f1239<\u002Fspan> crimson is the one colour to retire — it is the single biggest source of the generic feel. Keep it only as the PWA <span style=\"font:400 12px/1 ui-monospace,monospace\">theme-color<\u002Fspan> if the committee is attached to it, replaced here by terracotta 700.<\u002Fdiv>\n      <div style=\"display:flex;gap:9px;margin-top:12px\">\n        <div style=\"flex:1;background:#7a8a5e;border-radius:12px;padding:11px\"><div style=\"font:700 11.5px/1.2 Figtree,sans-serif;color:#f5ead8\">Open slot<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;background:#c9bda8;border-radius:12px;padding:11px\"><div style=\"font:700 11.5px/1.2 Figtree,sans-serif;color:#3b342c\">Booked<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;background:#c67139;border-radius:12px;padding:11px\"><div style=\"font:700 11.5px/1.2 Figtree,sans-serif;color:#2b1405\">Live now<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:30px;padding-top:22px;border-top:1px solid rgba(32,30,29,.12)\">\n    <div style=\"font:700 11px/1 Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8a7f75\">Bilingual rule — the highest-leverage change<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:14px\">\n      <div style=\"background:#ebddc5;border-radius:16px;padding:16px\">\n        <div style=\"font:700 10.5px/1 Figtree,sans-serif;letter-spacing:.12em;color:#7c3f1d\">TODAY<\u002Fdiv>\n        <div style=\"font:700 15px/1.35 Figtree,sans-serif;color:#201e1d;margin-top:9px\">Book Aarti Seva / आरती सेवेसाठी नाव नोंदवा<\u002Fdiv>\n        <div style=\"font:400 13px/1.55 Figtree,sans-serif;color:#5c534d;margin-top:9px\">Slash-joined strings double every label, wrap onto two or three lines, and force both languages on a reader who only needs one. Headings, buttons, filters and field labels all carry the tax.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#ebddc5;border:1.5px solid #7a8a5e;border-radius:16px;padding:16px\">\n        <div style=\"font:700 10.5px/1 Figtree,sans-serif;letter-spacing:.12em;color:#4e5b38\">RECOMMENDED<\u002Fdiv>\n        <div style=\"margin-top:9px\"><div style=\"font-family:'Baloo 2',sans-serif;font-weight:700;font-size:21px;line-height:1.25;color:#201e1d\">आरती सेवेसाठी नाव नोंदवा<\u002Fdiv><div style=\"font:600 13px/1.4 Figtree,sans-serif;color:#8a7f75\">Book Aarti Seva<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:400 13px/1.55 Figtree,sans-serif;color:#5c534d;margin-top:9px\">Marathi leads at full size on every event and competition name; the English trails one step down in muted ink. Chrome — buttons, filters, nav, field labels — is English only. No language switch: both languages are always present where they carry meaning.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:26px;padding-top:22px;border-top:1px solid rgba(32,30,29,.12);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px\">\n    <div><div style=\"font:700 13.5px/1.3 Figtree,sans-serif;color:#201e1d\">Hierarchy<\u002Fdiv><div style=\"font:400 12.5px/1.5 Figtree,sans-serif;color:#5c534d;margin-top:5px\">Every page opens with one dominant element: a hero, a date rail or a page title at 28px+. Section labels drop to 11px uppercase. Nothing in between competes.<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font:700 13.5px/1.3 Figtree,sans-serif;color:#201e1d\">Density<\u002Fdiv><div style=\"font:400 12.5px/1.5 Figtree,sans-serif;color:#5c534d;margin-top:5px\">18px page gutter on mobile, 4px base scale, 16px card radius, 999px on controls. Cards are separated by 10–12px, sections by 28px.<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font:700 13.5px/1.3 Figtree,sans-serif;color:#201e1d\">Icons &amp; imagery<\u002Fdiv><div style=\"font:400 12.5px/1.5 Figtree,sans-serif;color:#5c534d;margin-top:5px\">Lucide at stroke-width 2.75. Photos and the pamphlet go through a washed, rounded wrapper. No hand-drawn ornament.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"1b\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>Shared shell — mobile tab bar, desktop header<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:660px;padding:26px 28px 30px\">\n  <div style=\"font:700 11px/1 Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8a7f75\">Navigation<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:26px;margin-top:16px\">\n    <div style=\"width:100%;max-width:420px\">\n      <div style=\"font:700 13px/1.3 Figtree,sans-serif;color:#201e1d;margin-bottom:10px\">Mobile — 5 tabs, thumb-reachable. No language toggle; the day badge takes that slot.<\u002Fdiv>\n      <div style=\"background:#f5ead8;border:1px solid rgba(32,30,29,.12);border-radius:20px;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(32,30,29,.1)\">\n          <div style=\"display:flex;align-items:center;gap:9px\"><div style=\"width:30px;height:30px;border-radius:50%;background:#c67139;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;color:#fff\">श्री<\u002Fdiv><div style=\"font-family:Caprasimo,serif;font-size:15px;line-height:1;color:#201e1d\">Palladium Plus<\u002Fdiv><\u002Fdiv>\n          <div style=\"font:700 12.5px/1 Figtree,sans-serif;color:#7c3f1d;background:#f0d9c1;border-radius:999px;padding:8px 13px\">Day 1<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;padding:10px 4px 14px;background:#f5ead8\">\n          <div style=\"flex:1;text-align:center\"><div style=\"width:26px;height:26px;border-radius:50%;background:#c67139;margin:0 auto 6px\"><\u002Fdiv><div style=\"font:700 11px/1 Figtree,sans-serif;color:#7c3f1d\">Home<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1;text-align:center\"><div style=\"width:26px;height:26px;border-radius:50%;background:rgba(32,30,29,.1);margin:0 auto 6px\"><\u002Fdiv><div style=\"font:600 11px/1 Figtree,sans-serif;color:#8a7f75\">Schedule<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1;text-align:center\"><div style=\"width:26px;height:26px;border-radius:50%;background:rgba(32,30,29,.1);margin:0 auto 6px\"><\u002Fdiv><div style=\"font:600 11px/1 Figtree,sans-serif;color:#8a7f75\">Aarti<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1;text-align:center\"><div style=\"width:26px;height:26px;border-radius:50%;background:rgba(32,30,29,.1);margin:0 auto 6px\"><\u002Fdiv><div style=\"font:600 11px/1 Figtree,sans-serif;color:#8a7f75\">Winners<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1;text-align:center\"><div style=\"width:26px;height:26px;border-radius:50%;background:rgba(32,30,29,.1);margin:0 auto 6px\"><\u002Fdiv><div style=\"font:600 11px/1 Figtree,sans-serif;color:#8a7f75\">More<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:400 12.5px/1.5 Figtree,sans-serif;color:#5c534d;margin-top:9px\">Admin moves out of the public tab row into “More”, alongside contacts and the pamphlet. 44px minimum hit targets; safe-area padding at the bottom.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:100%\">\n      <div style=\"font:700 13px/1.3 Figtree,sans-serif;color:#201e1d;margin-bottom:10px\">Desktop — one header, no duplicate footer nav<\u002Fdiv>\n      <div style=\"background:#f5ead8;border:1px solid rgba(32,30,29,.12);border-radius:20px;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 18px\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:32px;height:32px;border-radius:50%;background:#c67139;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;color:#fff\">श्री<\u002Fdiv><div><div style=\"font-family:Caprasimo,serif;font-size:15px;line-height:1.1;color:#201e1d\">Palladium Plus<\u002Fdiv><div style=\"font:600 10.5px/1.2 Figtree,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#8a7f75\">Ganeshotsav 2026<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px\">\n            <div style=\"font:700 13px/1 Figtree,sans-serif;color:#7c3f1d;border-bottom:2px solid #c67139;padding-bottom:3px\">Home<\u002Fdiv>\n            <div style=\"font:600 13px/1 Figtree,sans-serif;color:#5c534d\">Schedule<\u002Fdiv>\n            <div style=\"font:600 13px/1 Figtree,sans-serif;color:#5c534d\">Aarti<\u002Fdiv>\n            <div style=\"font:600 13px/1 Figtree,sans-serif;color:#5c534d\">Winners<\u002Fdiv>\n            <div style=\"font:700 12.5px/1 Figtree,sans-serif;color:#fff;background:#c67139;border-radius:999px;padding:9px 14px;margin-left:4px\">Book aarti<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:400 12.5px/1.5 Figtree,sans-serif;color:#5c534d;margin-top:9px\">Content caps at 1120px and centres; the hero and schedule move to two columns. The footer becomes a footer — society contacts, commi
